server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: inventory-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:inventory}
    username: ${DB_USERNAME:inventory_user}
    password: ${DB_PASSWORD:inventory_pass}

  jpa:
    hibernate:
      # validate, not update/create — schema changes are deliberate, not
      # auto-guessed by Hibernate. Flyway/manual DDL comes if this grows
      # past Week 1; for now the entity IS the schema (ddl-auto: update
      # is fine to bootstrap, revisit once there's real data to protect).
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

inventory:
  hold:
    # Bound into InventoryProperties (typed @ConfigurationProperties),
    # not read as a raw ${...} placeholder in HoldService — this is the
    # config value business logic actually consumes.
    ttl-seconds: ${HOLD_TTL_SECONDS:300}
  reconciliation:
    enabled: ${RECONCILIATION_ENABLED:true}
    # How often HoldReconciliationService sweeps for HELD seats whose
    # Redis hold key has already expired. 30s in dev/test so it's fast to
    # observe; a real 5-minute hold TTL could reasonably use a slower
    # sweep in production, but this is the same knob either way.
    interval-ms: ${RECONCILIATION_INTERVAL_MS:30000}

management:
  endpoints:
    web:
      exposure:
        # Only health + info, not the full Actuator surface (env, beans,
        # heapdump, ...) — those leak internal detail and this service has
        # no auth in front of them yet.
        include: health,info

logging:
  pattern:
    # Filled by CorrelationIdFilter (Day 4) — every request now carries a
    # real value here instead of the "none" placeholder from Day 1-3.
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{correlationId:-none}] %logger{36} - %msg%n"
