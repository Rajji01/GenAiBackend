server:
  # 8082, not 8081 — a different port for a different service. Sharing a
  # port on the same host is not "microservices," it's a collision.
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: booking-service

  datasource:
    # Own database — database-per-service. Same Postgres server as
    # inventory in local dev (one container is cheaper than two on this
    # machine, and inventory + booking never JOIN across schemas by
    # design), different database name. In real AWS this becomes its own
    # RDS instance.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:booking}
    username: ${DB_USERNAME:booking_user}
    password: ${DB_PASSWORD:booking_pass}

  jpa:
    hibernate:
      # Same reasoning as inventory-service's application.yml: fine for
      # bootstrap, revisit with Flyway once there's real data to protect.
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

booking:
  inventory:
    # Day 3: base URL + timeout of the outgoing inventory-service calls.
    # In docker-compose this becomes http://inventory-service:8081.
    base-url: ${INVENTORY_BASE_URL:http://localhost:8081}
    timeout: ${INVENTORY_TIMEOUT:3s}
  payment:
    # Week 3: outgoing payment-service calls. Payment can be slower than
    # inventory (real gateways add auth latency), so 5s timeout instead
    # of 3s. In docker-compose this becomes http://payment-service:8083.
    base-url: ${PAYMENT_BASE_URL:http://localhost:8083}
    timeout: ${PAYMENT_TIMEOUT:5s}
  outbox:
    # Week 3: how often the same-process poller drains the outbox table.
    # Fast enough that publish latency stays under a second in the common
    # case; slow enough that it doesn't hammer the DB with empty polls.
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:2000}
    # Retention for already-published rows. Nightly job could prune;
    # not implemented in Week 3.
    retention-days: 30
  recovery:
    # Week 3: dangling-saga sweep interval. Age filter (not property) is
    # 2 minutes — the sweep never touches a booking younger than that,
    # so it can't race an in-flight saga.
    sweep-interval-ms: ${RECOVERY_SWEEP_INTERVAL_MS:60000}

# Retry + circuit breaker on outgoing HTTP calls. TWO independent
# instances so payment being unhealthy doesn't open inventory's CB and
# vice versa. Every lesson from Bugs 5+6 applied: whitelist-only, no
# ignore-exceptions block naming any parent class (that's the trap that
# silently killed retry). Fallback methods throw the NON-transient base
# type (bug 6 fix) so Retry doesn't retry the CB-open case.
resilience4j:
  retry:
    instances:
      inventory:
        max-attempts: 3
        wait-duration: 200ms
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - com.ticketing.booking.client.InventoryTransientException
      payment:
        max-attempts: 3
        wait-duration: 300ms
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - com.ticketing.booking.client.PaymentTransientException
  circuitbreaker:
    instances:
      inventory:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - com.ticketing.booking.client.InventoryTransientException
      payment:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - com.ticketing.booking.client.PaymentTransientException

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    # Filled by CorrelationIdFilter — same shape as inventory + payment so
    # a single grep across three services' logs reads consistently.
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{correlationId:-none}] %logger{36} - %msg%n"
