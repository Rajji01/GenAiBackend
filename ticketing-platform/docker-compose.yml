services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-inventory}
      POSTGRES_USER: ${DB_USERNAME:-inventory_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-inventory_pass}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Init scripts run exactly once, on the FIRST container start against
      # a fresh volume. Adds the booking database (+ user) alongside the
      # inventory one — see db-init/create-booking-db.sh for why the two
      # services share one Postgres server in local dev.
      - ./db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-inventory_user} -d ${DB_NAME:-inventory}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  inventory-service:
    build: ./inventory-service
    ports:
      - "${INVENTORY_SERVER_PORT:-8081}:8081"
    environment:
      # Container-network hostnames, not localhost — inside the compose
      # network, "postgres" and "redis" resolve to the other containers.
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-inventory}
      DB_USERNAME: ${DB_USERNAME:-inventory_user}
      DB_PASSWORD: ${DB_PASSWORD:-inventory_pass}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  booking-service:
    build: ./booking-service
    ports:
      - "${BOOKING_SERVER_PORT:-8082}:8082"
    environment:
      # Own DB, on the same Postgres server as inventory (see db-init/).
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: booking
      DB_USERNAME: booking_user
      DB_PASSWORD: booking_pass
      # The links that tie booking to its two downstreams. Container
      # hostnames, not localhost — localhost inside booking's own
      # container would loop back to itself.
      INVENTORY_BASE_URL: http://inventory-service:8081
      PAYMENT_BASE_URL: http://payment-service:8083
      NOTIFICATION_BASE_URL: http://notification-service:8084
    depends_on:
      postgres:
        condition: service_healthy
      # Not service_healthy on inventory-service or payment-service:
      # startup ordering coupling defeats microservices. Resilience4j on
      # the outgoing calls handles temporary unavailability at runtime.
      inventory-service:
        condition: service_started
      payment-service:
        condition: service_started
      notification-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  payment-service:
    # Week 3 addition — payment authorize + capture + refund with Adapter
    # + Factory + Strategy for the three stubbed payment methods
    # (UPI/Card/NetBanking). See WEEK3_DESIGN.md.
    build: ./payment-service
    ports:
      - "${PAYMENT_SERVER_PORT:-8083}:8083"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: payment
      DB_USERNAME: payment_user
      DB_PASSWORD: payment_pass
      # Failure-injection knobs for Day 5 experiments, off by default.
      PAYMENT_SIMULATE_AUTH_FAILURE: ${PAYMENT_SIMULATE_AUTH_FAILURE:-false}
      PAYMENT_SIMULATE_CAPTURE_FAILURE: ${PAYMENT_SIMULATE_CAPTURE_FAILURE:-false}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  notification-service:
    # Week 3 Day 5 addition — downstream consumer of booking events.
    # Receives via HTTP webhook from booking-service's EventBus. Phase 3
    # replaces the HTTP transport with SNS/SQS; this service becomes an
    # SQS subscriber with zero code change on the receive side (only the
    # transport layer swaps).
    build: ./notification-service
    ports:
      - "${NOTIFICATION_SERVER_PORT:-8084}:8084"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: notification
      DB_USERNAME: notification_user
      DB_PASSWORD: notification_pass
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
