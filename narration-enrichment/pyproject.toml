[project]
name = "narration-enrichment"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rajat Agrawal", email = "rajatagrawal2702@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "google-genai>=2.23.0",
    "instructor[google-genai]>=1.17.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.53",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.52.4",
    # P2 Day 4 — S3 backing for raw policy docs. Bucket + credentials
    # are Rajat's per AGENTS rule 3-2; boto3 client is what this code
    # actually needs. moto (dev-only) fakes S3 in tests so CI never
    # touches real AWS.
    "boto3>=1.35.0",
]

[project.scripts]
narration-enrichment = "narration_enrichment:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    # moto fakes S3 (and other AWS services) in-process so tests can
    # exercise the full boto3 code path without a real bucket or
    # credentials. Only pulled in for tests, never at runtime.
    "moto[s3]>=5.0.0",
]
