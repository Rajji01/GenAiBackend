spring.application.name=backend

# MySQL Database Configuration
# Credentials are read from environment variables (DB_USERNAME / DB_PASSWORD).
# The fallback values after ':' only exist so this still runs on this dev
# machine without extra setup — a real deployment must set the env vars and
# should not rely on (or even have) a hardcoded fallback for the password.
spring.datasource.url=jdbc:mysql://localhost:3306/ufcmain?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:rajat}

# MySQL JDBC Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

## Hibernate JPA Properties
# Schema is owned by Flyway migrations (db/migration). Hibernate only validates
# that the entity mappings match the real schema; it never creates/alters tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway
# This database (ufcmain) already had its schema created by Hibernate before
# Flyway was introduced. Baseline it at V1 so Flyway treats V1 as already
# applied here instead of trying to CREATE TABLE against existing tables.
# A fresh/new environment has no schema yet, so baseline is a no-op there and
# Flyway runs V1 for real.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Minimal stopgap so @Valid failures return a structured RFC 7807 body instead
# of Spring's raw default error page. A proper consistent error contract
# (custom @ControllerAdvice) is the next foundation item, not this one.
spring.mvc.problemdetails.enabled=true
